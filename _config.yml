url: "https://ekildar27.github.io"
baseurl: "/automatic-app-landing-page"

# Site Info (portfolio homepage)
page_title                                : Ekildar Office Apps
site_description                          : A collection of mobile apps crafted with care.
ios_app_country                           : us

enable_smart_app_banner                   : false
auto_load_app_store_screenshots           : true

# Information About Yourself
your_name                                 :
your_link                                 :
your_city                                 :
email_address                             :
linkedin_username                         :
linkedin_company                          :
facebook_username                         :
instagram_username                        :
twitter_username                          :
github_username                           :
youtube_username                          :

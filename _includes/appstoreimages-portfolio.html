<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>

{% assign app_ids = site.apps | map: 'ios_app_id' | join: ',' %}

<script>
$(function() {
    var apiURL = "https://itunes.apple.com/lookup?id={{ app_ids }}&country={{ site.ios_app_country }}&callback=?";

    $.getJSON(apiURL, function(json) {
        if (!json.results || !json.results.length) return;

        console.info("Portfolio app metadata loaded from Apple API.");

        var appsById = {};
        json.results.forEach(function(appInfo) {
            appsById[appInfo.trackId] = appInfo;
        });

        $(".appCard").each(function() {
            var $card = $(this);
            var appId = parseInt($card.data("app-id"), 10);
            var appInfo = appsById[appId];
            if (!appInfo) return;

            $card.find('[data-role="icon"]').attr({
                src: appInfo.artworkUrl512,
                alt: appInfo.trackName
            });

            $card.find('[data-role="name"]').text(appInfo.trackName);
            $card.find('[data-role="price"]').text(appInfo.formattedPrice);
        });

        var firstApp = json.results[0];
        if (firstApp) {
            $('link[rel="shortcut icon"]').attr("href", firstApp.artworkUrl512);
        }
    });
});
</script>

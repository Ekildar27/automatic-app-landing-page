<!DOCTYPE html>
<html lang="en-us">

{% include head.html %}

<body>
    <div class="imageWrapper portfolioHero">
        <div class="headerBackground">
            <div class="container portfolioContainer">
                {% include header-portfolio.html %}

                <div class="portfolioIntro">
                    <h1 class="portfolioTitle">{{ site.page_title }}</h1>
                    <p class="portfolioSubtitle">{{ site.site_description }}</p>
                </div>

                <div class="appGrid" id="appGrid">
                    {% for app in site.apps %}
                    <a class="appCard" href="{{ app.url | relative_url }}" data-app-id="{{ app.ios_app_id }}" target="_self">
                        <div class="appCardIconShadow">
                            <img class="appCardIcon" src="" alt="" data-role="icon">
                        </div>
                        <div class="appCardInfo">
                            <h2 class="appCardName" data-role="name"></h2>
                            <p class="appCardPrice" data-role="price"></p>
                            <p class="appCardDesc">{{ app.app_description }}</p>
                        </div>
                        <span class="appCardLink">View details →</span>
                    </a>
                    {% endfor %}
                </div>

                {% include footer.html %}
                {% include appstoreimages-portfolio.html %}
            </div>
        </div>
    </div>
</body>
</html>
